name: Validate pinned skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts-skills/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ts-skills
      - run: npm run check
        working-directory: ts-skills

  # Browserless: no Chrome, no live search engines, no credentials. The e2e and
  # gate scripts are deliberately not run here — they need a real browser and a
  # pre-aged anonymous Google cookie pair, and e2e exits 2 rather than failing
  # when every engine is blocked, which on a datacenter runner is the norm.
  browser-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Scan every tree for committed secrets
        run: node pi-browser-search/tools/secret-scan.mjs
      - run: npm install --no-audit --no-fund
        working-directory: pi-browser-search
      - run: npm test
        working-directory: pi-browser-search
